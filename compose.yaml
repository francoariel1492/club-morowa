services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: morowa
      MYSQL_USER: morowa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-morowa_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_change_me}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - morowa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  morowa_mysql:
